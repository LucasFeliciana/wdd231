  <!-- CSS -->

<body>
  <header>
    <div class="header-content">
      <a href="index.html" class="logo">⚽ Soccer Legends</a>

      <button id="menu-button"
              type="button"
              aria-label="Open navigation menu"
              aria-expanded="false"
              aria-controls="primary-navigation">
        ☰
      </button>

      <nav id="primary-navigation" aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="legends.html">Legends</a></li>
          <li>
            <a href="compare.html" class="active" aria-current="page">
              Compare
            </a>
          </li>
          <li><a href="suggest.html">Suggest a Legend</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="compare-section">
      <div class="section-heading">
        <h1>Compare Soccer Legends</h1>
        <p>
          Select two legendary players and compare their
          career statistics and achievements.
        </p>
      </div>

      <!-- Player Selection -->
      <div class="compare-selectors">
        <div class="compare-select-group">
          <label for="player-one">First Player</label>
          <select id="player-one">
            <option value="">Select a player</option>
          </select>
        </div>

        <div class="compare-select-group">
          <label for="player-two">Second Player</label>
          <select id="player-two">
            <option value="">Select a player</option>
          </select>
        </div>
      </div>

      <div class="compare-action">
        <button type="button" id="compare-button">
          Compare Players
        </button>
      </div>

      <p id="compare-message" role="status" aria-live="polite"></p>

      <!-- Comparison Results -->
      <div id="comparison-results" hidden>
        <!-- JavaScript will generate the comparison -->
      </div>

    </section>
  </main>

    <footer>
